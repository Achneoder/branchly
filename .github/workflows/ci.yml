name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run format
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

      - name: Run integration tests (xvfb)
        run: xvfb-run -a npm run test:integration

      - name: Package extension
        run: npx vsce package
